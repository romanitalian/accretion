name: Accretion
options:
  bundleIdPrefix: com.romanitalian
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: NKK9LAQ25S
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Accretion:
    type: application
    platform: iOS
    sources: [Accretion]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romanitalian.accretion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Accretion
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
        # No custom crypto: skips the export-compliance question on every TestFlight build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.casual-games
  AccretionTests:
    type: bundle.unit-test
    platform: iOS
    # Engine is pure Swift, so tests compile it directly and run without launching the app.
    sources:
      - AccretionTests
      - Accretion/Engine
      - Accretion/Progress
      - Accretion/Audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romanitalian.accretion.tests
        GENERATE_INFOPLIST_FILE: YES
  # App Store screenshots (`make screenshots`); not part of `make test`.
  AccretionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AccretionUITests]
    dependencies:
      - target: Accretion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romanitalian.accretion.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Accretion:
    build:
      targets:
        Accretion: all
        AccretionTests: [test]
        AccretionUITests: [test]
    test:
      targets: [AccretionTests, AccretionUITests]
